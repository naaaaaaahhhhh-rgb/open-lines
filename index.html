<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stay in LA Open Lines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Two phone lines. Nobody picks up. Call the Hope Line or the Rage Line and leave a message.">
<meta property="og:title" content="Open Lines — Stay in LA">
<meta property="og:description" content="Two phone lines. Nobody picks up. Hopeful or raging, call and leave a message.">
<link rel="stylesheet" href="site.css">
<script src="config.js"></script>
<script src="site.js"></script>
</head>
<body data-sparkles="page">

<header class="site-head">
  <div class="wrap">
    <img class="logo" src="images/logo-cream.png" alt="Stay in LA — There's no place like home">
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <div class="title-wrap">
        <h1 class="tv-text tv-flash">Open Lines</h1>
      </div>
      <p class="hear">LIMITED TIME ONLY!&emsp;CALL NOW!</p>
    </div>
  </section>

  <section class="pick">
    <div class="wrap pick-grid">
      <a class="pick-link pick-link--hope" href="hope.html">
        <img class="pick-img" src="images/btn-hope.png" alt="Call the Hope Line">
      </a>
      <a class="pick-link pick-link--rage" href="rage.html">
        <img class="pick-img" src="images/btn-rage.png" alt="Call the Rage Line">
      </a>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap">
    <p class="fine">Messages left on either line may be edited and shared publicly by Stay in LA.<br>Nobody answers these calls; they go straight to voicemail.</p>
  </div>
</footer>
